[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

extra_scripts = pre:../extra_script.py
lib_extra_dirs = ../

lib_deps =
    sciot-common
    nanopb/Nanopb@^0.4.9
    knolleary/PubSubClient@^2.8

# WIFI_SSID, WIFI_PASS, MQTT_HOST, NODE_ID are injected from firmware/.env
# (and optionally firmware/node-example/.env for overrides) by extra_script.py.
# See firmware/.env.example.
