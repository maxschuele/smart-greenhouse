[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

extra_scripts = pre:../extra_script.py
lib_extra_dirs = ../

# The Adafruit DHT library ships DHT_U.cpp, which pulls in Adafruit_Sensor.h from
# the sibling Unified Sensor lib. The default LDF does not cross-link the two, so
# add both include dirs explicitly (applies to every translation unit, including
# the library sources). This avoids changing lib_ldf_mode globally, which breaks
# the sgh-common (nanopb + PubSubClient) resolution.
build_flags =
    -I "${platformio.libdeps_dir}/${this.__env__}/DHT sensor library"
    -I "${platformio.libdeps_dir}/${this.__env__}/Adafruit Unified Sensor"

lib_deps =
    sgh-common
    nanopb/Nanopb@^0.4.9
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.7
    adafruit/Adafruit Unified Sensor@^1.1
