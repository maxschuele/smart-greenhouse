[project]
name = "sciot-hub"
version = "0.1.0"
description = "Central control hub for the SCIoT smart buildings framework"
requires-python = ">=3.14"
dependencies = [
    "aiomqtt>=2.3.0",
    "aiosqlite>=0.20",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub"]

[tool.pyright]
venvPath = "."
venv = ".venv"
