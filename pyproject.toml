[project]
name = "sgh-hub"
version = "0.1.0"
description = "Central control hub for the SGH smart buildings framework"
requires-python = ">=3.14"
dependencies = [
    "aiomqtt>=2.3.0",
    "aiosqlite>=0.20",
    "fastapi>=0.115.0",
    "ruff>=0.15.14",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "grpcio-tools>=1.80.0",
    "nanopb>=0.4.9.1",
]
